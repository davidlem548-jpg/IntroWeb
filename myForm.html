<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con localStorage</title>
    <script>
        function guardarDatos() { 
            if (!document.querySelector("form").checkValidity()){
                alert("Debes completar todos los campos para guardar tus datos"); return}    
            let nombre = document.getElementById("nombre").value;
            let edad = document.getElementById("edad").value;
            let diaFavorito = document.getElementById("dias").value;
            localStorage.setItem("infoUsuario", JSON.stringify({nombre, edad, diaFavorito}));
            alert("Datos guardados correctamente"); // Para poder hacer submit los campos deben estar llenos
        }
        function mostrarDatos() {
            let info = JSON.parse(localStorage.getItem("infoUsuario"));
            document.getElementById("mostrarInfo").innerHTML = info ?
                "Hola " + info.nombre + ", tienes " + info.edad + " años y tu día favorito es el " + info.diaFavorito : ""
        }
    </script>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body onload='mostrarDatos()'><br>
    <form class = "container" novalidate>
        <label for="nombre" class="badge text-bg-info" style="font-size: 1rem">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required><br><br>

        <label for="edad" class="badge text-bg-info" style="font-size: 1rem">Edad:</label>
        <input type="number" id="edad" name="edad" required><br><br>

        <label for="diaSemana" class="badge text-bg-info" style="font-size: 1rem">Tu día de la semana favorito:</label>
        <select id="dias" name="dias" required>
            <option value="lunes">Lunes</option>
            <option value="martes">Martes</option>
            <option value="miercoles">Miércoles</option>
            <option value="jueves">Jueves</option>
            <option value="viernes">Viernes</option>
            <option value="sábado">Sábado</option>
            <option value="domingo">Domingo</option>
        </select><br><br>

        <button onclick= 'guardarDatos()' type="submit" id="bttnSubir" title="Guardar" class = "btn btn-primary">Guardar</button>
        <br><br>
        <p id="mostrarInfo" class="badge text-bg-secondary" style="font-size: 1.5rem;"></p>
    </form>
</body>
</html>
